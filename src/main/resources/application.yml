server:
  port: 8081
app:
  jwt:
    secret: your-super-secret-key-replace-this-in-production-must-be-256-bits
    expiration-ms: 900000        # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days
spring:
  application:
    name: demo

  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true